[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentipipe"
version = "0.1.0"
description = "Out-of-sample social and news sentiment asset price pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "apify-client>=1.7,<3",
  "exa-py>=1.0,<2",
  "joblib>=1.3,<2",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "PyYAML>=6,<7",
  "python-dotenv>=1.0,<2",
  "scikit-learn>=1.3,<2",
  "yfinance>=0.2.40,<2",
  "vaderSentiment>=3.3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
sentipipe = "sentipipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
